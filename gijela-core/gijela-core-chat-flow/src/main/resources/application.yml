server:
  port: 9010
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

mybatis-plus:
  mapper-locations: classpath:/mapper/**.xml
  type-aliases-package: com.gijela.morpheus.chatflow.domain.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

chat-flow:
  engine:
    timeout-ms: 60000
    max-retry: 0
    concurrency: 1
